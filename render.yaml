services:
  - type: web
    name: ksp-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PROJECT_NAME
        value: "KSP AI Platform"
      - key: API_V1_STR
        value: "/api/v1"
      # The following must be set in the Render Dashboard manually for security:
      # - DATABASE_URL
      # - GEMINI_API_KEY
      # - CORS_ORIGINS
